<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大一體育（音樂系）期中成績試算與反思</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
    .card-option { transition: all 0.2s ease-in-out; }
    .card-option:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-emerald-700 text-white shadow-md mb-8">
    <div class="max-w-4xl mx-auto px-4 py-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-award"></i>
          大一體育（音樂系）期中成績試算
        </h1>
        <p class="text-emerald-100 text-sm mt-1">自主選擇學習採計比例與心得反思</p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 space-y-6">

    <!-- Step 1: 學號查詢 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs flex items-center justify-center font-bold">1</span>
        查詢學生資料
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">請輸入學號：</label>
          <div class="flex gap-2">
            <input type="text" id="studentId" placeholder="例如：1154171" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none uppercase font-mono">
            <button onclick="searchStudent()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl font-medium transition flex items-center gap-1 shrink-0">
              <i class="fa-solid fa-magnifying-glass"></i> 查詢
            </button>
          </div>
        </div>
        <div id="studentInfoBox" class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col justify-center">
          <p class="text-sm text-slate-500 text-center">請輸入學號進行資料比對...</p>
        </div>
      </div>
    </section>

    <!-- Step 2: 籃球成績與採計比例選擇 -->
    <section id="step2Section" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 opacity-50 pointer-events-none transition-all">
      <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs flex items-center justify-center font-bold">2</span>
        輸入籃球測驗成績與選擇加權比例
      </h2>

      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-600 mb-1">今日籃球測驗成績 (0 - 100)：</label>
        <div class="flex items-center gap-4">
          <input type="number" id="basketballScore" min="0" max="100" value="80" oninput="updateCalculations()" class="w-32 px-4 py-2 border border-slate-300 rounded-xl text-lg font-bold text-center focus:ring-2 focus:ring-emerald-500 outline-none">
          <input type="range" id="basketballRange" min="0" max="100" value="80" oninput="syncBasketballInput(this.value)" class="w-full accent-emerald-600">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Option A -->
        <label class="card-option cursor-pointer block border-2 border-slate-200 rounded-xl p-4 relative" id="optLabelA">
          <input type="radio" name="weightRatio" value="羽80%-籃20%" onchange="selectOption('A')" class="hidden">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-slate-700">方案 A</span>
            <span id="badgeA" class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">羽球主導</span>
          </div>
          <p class="text-xs text-slate-500 mb-3">羽球 80% ＋ 籃球 20%</p>
          <div class="text-2xl font-black text-emerald-600" id="scoreA">0 分</div>
        </label>

        <!-- Option B -->
        <label class="card-option cursor-pointer block border-2 border-slate-200 rounded-xl p-4 relative" id="optLabelB">
          <input type="radio" name="weightRatio" value="羽20%-籃80%" onchange="selectOption('B')" class="hidden">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-slate-700">方案 B</span>
            <span id="badgeB" class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">籃球主導</span>
          </div>
          <p class="text-xs text-slate-500 mb-3">羽球 20% ＋ 籃球 80%</p>
          <div class="text-2xl font-black text-emerald-600" id="scoreB">0 分</div>
        </label>

        <!-- Option C -->
        <label class="card-option cursor-pointer block border-2 border-slate-200 rounded-xl p-4 relative" id="optLabelC">
          <input type="radio" name="weightRatio" value="羽50%-籃50%" onchange="selectOption('C')" class="hidden">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-slate-700">方案 C</span>
            <span id="badgeC" class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">均衡採計</span>
          </div>
          <p class="text-xs text-slate-500 mb-3">羽球 50% ＋ 籃球 50%</p>
          <div class="text-2xl font-black text-emerald-600" id="scoreC">0 分</div>
        </label>
      </div>
    </section>

    <!-- Step 3: 心得反思與提交 -->
    <section id="step3Section" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 opacity-50 pointer-events-none transition-all">
      <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs flex items-center justify-center font-bold">3</span>
        選擇理由與心得反思
      </h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">請說明選擇此比例配置的理由與自我反思：</label>
          <textarea id="reflectionText" rows="4" placeholder="例如：因為我在羽球發球項目發揮較為穩定取得相對高分，因此選擇羽球 80% 的比例來展現個人優勢..." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm"></textarea>
        </div>
        <button onclick="submitForm()" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> 確認送出成績配置表
        </button>
      </div>
    </section>

  </main>

  <script>
    // 您已建立好的 Google Apps Script 部署網址
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzclWsyCQKJ9l9Oj5rHH7IQFWB6LN2v1dyu8Ib6NvApsIfD0mbRLg4DULPhpJ9rq5k/exec";

    // 音樂系 30 位同學真實資料庫 (來自 Excel)
    const studentDb = [
      { id: "1144826", name: "蔡宇恩", badminton: null },
      { id: "1154171", name: "讓可昀", badminton: 83 },
      { id: "1154172", name: "黃提諾", badminton: 88 },
      { id: "1154173", name: "邱堯龍", badminton: null },
      { id: "1154174", name: "羅允翔", badminton: 97 },
      { id: "1154175", name: "林家謙", badminton: null },
      { id: "1154176", name: "魏利澐", badminton: 80 },
      { id: "1154177", name: "高子程", badminton: 80 },
      { id: "1154178", name: "羅思涵", badminton: 84 },
      { id: "1154180", name: "洪煥喜", badminton: 77 },
      { id: "1154181", name: "王建誠", badminton: 92 },
      { id: "1154182", name: "劉芯怡", badminton: 70 },
      { id: "1154183", name: "許有量", badminton: 81 },
      { id: "1154184", name: "盧以綜", badminton: 69 },
      { id: "1154185", name: "黃頡睿", badminton: 84 },
      { id: "1154187", name: "張思媛", badminton: 70 },
      { id: "1154188", name: "陳玟妡", badminton: 83 },
      { id: "1154189", name: "楊鈞皓", badminton: 52 },
      { id: "1154190", name: "楊懿安", badminton: 88 },
      { id: "1154191", name: "許雁婷", badminton: 72 },
      { id: "1154192", name: "許綺珈", badminton: 83 },
      { id: "1154193", name: "鄭秭忻", badminton: 53 },
      { id: "1154194", name: "龍侑偵", badminton: null },
      { id: "1154195", name: "孫博陳", badminton: 88 },
      { id: "1154196", name: "張芷宸", badminton: 69 },
      { id: "1154197", name: "林禹彤", badminton: 64 },
      { id: "1154198", name: "邱信豪", badminton: 86 },
      { id: "1154199", name: "李攸", badminton: 86 },
      { id: "1154200", name: "葉芷妍", badminton: 70 },
      { id: "1154201", name: "李品成", badminton: 30 }
    ];

    let currentStudent = null;
    let selectedOpt = null;

    function searchStudent() {
      const inputId = document.getElementById('studentId').value.trim();
      const infoBox = document.getElementById('studentInfoBox');
      const student = studentDb.find(s => s.id === inputId);

      if (!student) {
        infoBox.innerHTML = `<p class="text-sm text-rose-600 font-medium text-center"><i class="fa-solid fa-circle-exclamation"></i> 查無此學號，請重新確認！</p>`;
        disableSteps();
        return;
      }

      currentStudent = { ...student };
      
      let badmintonHtml = '';
      if (student.badminton !== null) {
        badmintonHtml = `<span class="text-xl font-bold text-emerald-600">${student.badminton} 分</span>`;
      } else {
        badmintonHtml = `<div class="flex items-center gap-2"><input type="number" id="manualBadminton" value="75" min="0" max="100" oninput="updateManualBadminton(this.value)" class="w-20 px-2 py-1 border border-slate-300 rounded text-center text-sm font-bold"><span class="text-xs text-amber-600">（未登錄，可手動補充）</span></div>`;
        currentStudent.badminton = 75;
      }

      infoBox.innerHTML = `
        <div class="flex justify-between items-center">
          <div>
            <p class="font-bold text-slate-800 text-base">${student.name} <span class="text-xs font-normal text-slate-500">(${student.id})</span></p>
            <p class="text-xs text-slate-500">音樂系體育課學生</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-slate-400">羽球測驗成績</p>
            ${badmintonHtml}
          </div>
        </div>
      `;

      enableSteps();
      updateCalculations();
    }

    function updateManualBadminton(val) {
      if (currentStudent) {
        currentStudent.badminton = parseFloat(val) || 0;
        updateCalculations();
      }
    }

    function syncBasketballInput(val) {
      document.getElementById('basketballScore').value = val;
      updateCalculations();
    }

    function updateCalculations() {
      if (!currentStudent) return;

      const basketball = parseFloat(document.getElementById('basketballScore').value) || 0;
      document.getElementById('basketballRange').value = basketball;

      const badminton = currentStudent.badminton || 0;

      const scoreA = (badminton * 0.8 + basketball * 0.2).toFixed(1);
      const scoreB = (badminton * 0.2 + basketball * 0.8).toFixed(1);
      const scoreC = (badminton * 0.5 + basketball * 0.5).toFixed(1);

      document.getElementById('scoreA').innerText = scoreA + ' 分';
      document.getElementById('scoreB').innerText = scoreB + ' 分';
      document.getElementById('scoreC').innerText = scoreC + ' 分';
    }

    function selectOption(opt) {
      selectedOpt = opt;
      ['A', 'B', 'C'].forEach(o => {
        const label = document.getElementById('optLabel' + o);
        if (o === opt) {
          label.classList.add('border-emerald-600', 'bg-emerald-50/50');
          label.classList.remove('border-slate-200');
        } else {
          label.classList.remove('border-emerald-600', 'bg-emerald-50/50');
          label.classList.add('border-slate-200');
        }
      });
    }

    function enableSteps() {
      document.getElementById('step2Section').classList.remove('opacity-50', 'pointer-events-none');
      document.getElementById('step3Section').classList.remove('opacity-50', 'pointer-events-none');
    }

    function disableSteps() {
      document.getElementById('step2Section').classList.add('opacity-50', 'pointer-events-none');
      document.getElementById('step3Section').classList.add('opacity-50', 'pointer-events-none');
    }

    async function submitForm() {
      if (!currentStudent) {
        alert('請先輸入學號並完成查詢！');
        return;
      }
      if (!selectedOpt) {
        alert('請選擇一種比例採計方案！');
        return;
      }
      const reflection = document.getElementById('reflectionText').value.trim();
      if (!reflection) {
        alert('請填寫選擇理由與心得反思！');
        return;
      }

      const ratioNames = { 'A': '羽80%-籃20%', 'B': '羽20%-籃80%', 'C': '羽50%-籃50%' };
      const basketball = parseFloat(document.getElementById('basketballScore').value) || 0;
      const badminton = currentStudent.badminton || 0;
      
      let finalScore = 0;
      if (selectedOpt === 'A') finalScore = (badminton * 0.8 + basketball * 0.2).toFixed(1);
      if (selectedOpt === 'B') finalScore = (badminton * 0.2 + basketball * 0.8).toFixed(1);
      if (selectedOpt === 'C') finalScore = (badminton * 0.5 + basketball * 0.5).toFixed(1);

      const payload = {
        studentId: currentStudent.id,
        name: currentStudent.name,
        badminton: badminton,
        basketball: basketball,
        selectedRatio: ratioNames[selectedOpt],
        finalScore: finalScore,
        reflection: reflection
      };

      const btn = document.getElementById('submitBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 資料寫入 Google Sheet 中...`;

      try {
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert(`【提交成功！】\n資料已成功傳送至 Google 試算表！\n\n學生：${currentStudent.name} (${currentStudent.id})\n選擇方案：${ratioNames[selectedOpt]}\n試算總分：${finalScore} 分`);
        document.getElementById('reflectionText').value = '';
      } catch (error) {
        console.error('Submission Error:', error);
        alert('傳送失敗，請檢查網路連線或稍後再試！');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
